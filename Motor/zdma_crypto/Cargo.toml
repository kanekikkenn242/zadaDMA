[package]
name = "zdma_crypto"
version = "0.1.0"
edition = "2021"
[lib]
name = "zdma_crypto"
crate-type = ["staticlib"]
[dependencies]
aes-gcm = "0.10"
pbkdf2  = { version = "0.12", features = ["simple"] }
sha2    = "0.10"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
