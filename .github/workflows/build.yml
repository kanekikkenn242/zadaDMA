name: build-ipa
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - name: Rust staticlib
        working-directory: Motor/zdma_crypto
        run: cargo build --release --target aarch64-apple-ios
      - name: kexploit stub
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Motor/kexploit/build
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
                -O2 -c Motor/kexploit/stub/kexploit.c -o /tmp/kexploit.o
          ar rcs Motor/kexploit/build/libkexploit.a /tmp/kexploit.o
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
      - name: Build
        run: |
          xcodebuild -project zadaDMA.xcodeproj -scheme zadaDMA -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Verify .app
        run: |
          APP=build/Build/Products/Release-iphoneos/zadaDMA.app
          test -d "$APP" || { echo "missing .app"; exit 1; }
          ls -la "$APP"
          for w in Welcome activar desactivar; do
            test -f "$APP/${w}.wav" || echo "WARN: ${w}.wav mungon"
          done
          if [ -f "$APP/Assets.car" ]; then echo "Assets.car present"; else echo "Assets.car absent (ok)"; fi
      - name: Package IPA
        run: |
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R build/Build/Products/Release-iphoneos/zadaDMA.app pkg/Payload/
          (cd pkg && zip -ry ../zadaDMA-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: zadaDMA-ipa
          path: zadaDMA-unsigned.ipa
