name: build-ipa
on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
        
      - name: Build Rust Crypto
        working-directory: Motor/zdma_crypto
        run: cargo build --release --target aarch64-apple-ios
        
      - name: Download and Compile kfd
        run: |
          rm -rf Motor/kexploit/kfd
          git clone --depth 1 https://github.com/felix-pb/kfd.git Motor/kexploit/kfd
          rm -rf Motor/kexploit/kfd/.git
          
          cd Motor/kexploit/kfd
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          echo "=== Skedaret C qe u gjeten ==="
          find . -name "*.c" -print
          
          echo "=== Duke kompiluar ==="
          for f in $(find . -name "*.c"); do
            clang -c "$f" -arch arm64 -isysroot "$SDK" \
              -I./kfd -I./kfd/libkfd -I./kfd/libkfd/krkw -I./kfd/libkfd/puaf \
              -o "build/$(basename $f).o"
          done
          
          echo "=== Duke krijuar libkfd.a ==="
          ar rcs build/libkfd.a build/*.o
          ls -la build/libkfd.a
          
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml
        
      - name: Build iOS App
        run: |
          xcodebuild -project zadaDMA.xcodeproj -scheme zadaDMA -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            
      - name: Copy Patches
        run: |
          APP=build/Build/Products/Release-iphoneos/zadaDMA.app
          if [ -f Payload/zadaDMA.app/aimdrag_neck.3105 ]; then cp Payload/zadaDMA.app/aimdrag_neck.3105 "$APP/"; fi
          if [ -f Payload/zadaDMA.app/aimneck_90.3105 ]; then cp Payload/zadaDMA.app/aimneck_90.3105 "$APP/"; fi
          
      - name: Package IPA
        run: |
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R build/Build/Products/Release-iphoneos/zadaDMA.app pkg/Payload/
          (cd pkg && zip -ry ../zadaDMA-unsigned.ipa Payload)
          
      - uses: actions/upload-artifact@v4
        with:
          name: zadaDMA-ipa
          path: zadaDMA-unsigned.ipa
