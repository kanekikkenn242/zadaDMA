name: build-ipa
on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
        
      - name: Build Rust Crypto
        working-directory: Motor/zdma_crypto
        run: cargo build --release --target aarch64-apple-ios
        
      - name: Download and Build kfd
        run: |
          rm -rf Motor/kexploit/kfd
          git clone --depth 1 https://github.com/felix-pb/kfd.git Motor/kexploit/kfd
          rm -rf Motor/kexploit/kfd/.git
          
          cd Motor/kexploit/kfd
          echo "=== Struktura e KFD ==="
          ls -laR
          
          # Kompilojmë projektin e kfd për iOS arm64
          echo "=== Duke kompiluar kfd ==="
          xcodebuild -project kfd.xcodeproj -scheme kfd -configuration Release \
            -sdk iphoneos -arch arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build
          
          # Gjejmë librarinë e krijuar (nëse ekziston)
          echo "=== Duke gjetur librarine ==="
          find build -name "*.a" -o -name "*.dylib"
          
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml
        
      - name: Build iOS App
        run: |
          xcodebuild -project zadaDMA.xcodeproj -scheme zadaDMA -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            
      - name: Copy Patches
        run: |
          APP=build/Build/Products/Release-iphoneos/zadaDMA.app
          if [ -f Payload/zadaDMA.app/aimdrag_neck.3105 ]; then cp Payload/zadaDMA.app/aimdrag_neck.3105 "$APP/"; fi
          if [ -f Payload/zadaDMA.app/aimneck_90.3105 ]; then cp Payload/zadaDMA.app/aimneck_90.3105 "$APP/"; fi
          
      - name: Package IPA
        run: |
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R build/Build/Products/Release-iphoneos/zadaDMA.app pkg/Payload/
          (cd pkg && zip -ry ../zadaDMA-unsigned.ipa Payload)
          
      - uses: actions/upload-artifact@v4
        with:
          name: zadaDMA-ipa
          path: zadaDMA-unsigned.ipa
