name: build-ipa
on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: 
          targets: aarch64-apple-ios
          
      - name: Build zdma_crypto (Rust)
        run: |
          if [ -d "Motor/zdma_crypto" ]; then
            cd Motor/zdma_crypto
            cargo build --release --target aarch64-apple-ios
          fi
          
      - name: Download and Build idevice (Airlift)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CFLAGS: "-miphoneos-version-min=13.0"
          CXXFLAGS: "-miphoneos-version-min=13.0"
          RUSTFLAGS: "-C link-arg=-miphoneos-version-min=13.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.0"
          CMAKE_C_FLAGS: "-miphoneos-version-min=13.0"
          CMAKE_CXX_FLAGS: "-miphoneos-version-min=13.0"
          CMAKE_SYSTEM_NAME: "iOS"
          CMAKE_OSX_ARCHITECTURES: "arm64"
        run: |
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/Motor"
          LIB_PATH=""
          rm -rf vendor/idevice
          if git clone --depth 1 https://github.com/jkcoxson/idevice.git vendor/idevice; then
            cd vendor/idevice
            cargo build --release --target aarch64-apple-ios 2>&1 | tail -20 || true
            if [ -d "ffi" ]; then
              cd ffi
              cargo build --release --target aarch64-apple-ios 2>&1 | tail -20 || true
              cd ..
            fi
            LIB_PATH=$(find . -name "libidevice*.a" -type f 2>/dev/null | head -n 1)
          else
            echo "[-] Clone i idevice deshtoi - vazhdoj me stub."
          fi
          if [ -z "$LIB_PATH" ]; then
            echo "[-] libidevice*.a nuk u gjet. Krijoj stub qe linking te mos deshtoje."
            echo 'void __idevice_ffi_stub(void) {}' > /tmp/idevice_stub.c
            xcrun --sdk iphoneos clang -arch arm64 -c /tmp/idevice_stub.c -o /tmp/idevice_stub.o
            libtool -static -o "$ROOT/Motor/libidevice_ffi.a" /tmp/idevice_stub.o
          else
            echo "[+] Libraria u gjet: $LIB_PATH"
            cp "$LIB_PATH" "$ROOT/Motor/libidevice_ffi.a"
          fi
          ls -la "$ROOT/Motor/libidevice_ffi.a"
          
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Project
        run: xcodegen generate --spec project.yml
        
      - name: Build iOS App
        run: |
          xcodebuild -project zadaDMA.xcodeproj -scheme zadaDMA -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            
      - name: Force Copy Patches and Sounds
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -f Payload/zadaDMA.app/aimdrag_neck.3105 ]; then cp Payload/zadaDMA.app/aimdrag_neck.3105 "$APP/"; fi
          if [ -f Payload/zadaDMA.app/aimneck_90.3105 ]; then cp Payload/zadaDMA.app/aimneck_90.3105 "$APP/"; fi
          if [ -f Payload/zadaDMA.app/welcome.wav ]; then cp Payload/zadaDMA.app/welcome.wav "$APP/"; fi
          if [ -f Payload/zadaDMA.app/activar.wav ]; then cp Payload/zadaDMA.app/activar.wav "$APP/"; fi
          if [ -f Payload/zadaDMA.app/desactivar.wav ]; then cp Payload/zadaDMA.app/desactivar.wav "$APP/"; fi
          
      - name: Package IPA
        run: |
          rm -rf pkg && mkdir -p pkg/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" pkg/Payload/
          (cd pkg && zip -ry ../zadaDMA-unsigned.ipa Payload)
          
      - uses: actions/upload-artifact@v4
        with:
          name: zadaDMA-ipa
          path: zadaDMA-unsigned.ipa
